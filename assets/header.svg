    <circle cx="720" cy="242" r="5" fill="#68e8d0"/><circle cx="803" cy="184" r="5" fill="#68e8d0"/><circle cx="883" cy="219" r="8" fill="#101825"/><circle cx="964" cy="133" r="5" fill="#91a7ff"/><circle cx="1084" cy="167" r="5" fill="#91a7ff"/>
