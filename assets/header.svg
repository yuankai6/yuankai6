<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Yuan Kai — AI Forward Deployed Engineer</title>
  <desc id="desc">A dark technical canvas with a luminous signal path and the phrase From ambiguity to working systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101825"/><stop offset="1" stop-color="#080d16"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#68e8d0"/><stop offset="1" stop-color="#91a7ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a9c9e8" stroke-opacity=".055"/></pattern>
