  <text x="66" y="213" fill="#85e7d2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="2">AI FORWARD DEPLOYED ENGINEER</text>
  <text x="66" y="263" fill="#bac9d7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">From ambiguity to working systems.</text>
  <g fill="none" stroke="url(#line)" stroke-width="2">
