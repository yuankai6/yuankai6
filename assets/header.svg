  <g fill="#8196ab" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.5"><text x="66" y="385">BUILD WITH INTENT</text><text x="1025" y="385">YK / 01</text></g>
